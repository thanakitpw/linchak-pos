<div class="flex-1 flex flex-col items-center justify-center px-md py-xl">

<div class="flex flex-col items-center mb-lg">
<div class="w-24 h-24 bg-primary-container/10 rounded-full flex items-center justify-center mb-sm shadow-[0px_4px_12px_rgba(0,0,0,0.05)]">

</div>
<h1 class="font-display-lg text-display-lg text-primary-container text-center">
                    POS
                </h1>
</div>

<div class="inline-flex items-center gap-2 px-4 py-2 bg-secondary-container/30 rounded-full mb-xl">

</div>
</div>

<button class="w-full h-12 bg-primary-container text-white rounded-xl font-title-lg text-title-lg flex items-center justify-center shadow-[0px_4px_12px_rgba(43,177,79,0.2)] active:scale-[0.98] transition-transform duration-200">
