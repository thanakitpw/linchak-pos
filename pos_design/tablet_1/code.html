<style>
        /* Fallback smooth scroll */
        html { scroll-behavior: smooth; }
        /* Remove default input focus outline, handled by tailwind classes */
        input:focus { outline: none; }
    </style>
</head>
<body class="bg-surface min-h-screen flex flex-col font-sans">
<!-- TopAppBar (Transactional / Dead-end flow) -->
<header class="w-full top-0 bg-surface flex items-center justify-between px-md py-sm max-w-[1120px] mx-auto z-10 sticky">
<!-- Back Button -->
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-variant/20 transition-colors duration-200 active:scale-95">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<!-- Brand Anchor -->
<h1 class="font-headline-md text-headline-md font-bold text-primary flex-1 text-center pr-10">PromptPay POS</h1>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full flex items-center justify-center p-md md:p-xl container mx-auto">
<!-- Centered Card Container (Max 420px for Tablet/Desktop focus) -->
<!-- Elevation Level 2: Soft diffused shadow for active floating containers -->
<div class="w-full max-w-[420px] bg-surface-container-lowest rounded-xl shadow-[0px_4px_12px_rgba(0,0,0,0.05)] border border-surface-variant p-lg md:p-xl transition-all duration-300">
<!-- State 1: Input Form -->
<div class="flex flex-col gap-lg fade-in" id="forgot-password-form">
<!-- Header / Instruction -->
<div class="text-center flex flex-col gap-sm">
<h2 class="font-headline-md text-headline-md text-on-surface font-semibold">ลืมรหัสผ่าน?</h2>
<p class="font-body-md text-body-md text-on-surface-variant">
                        กรุณากรอกอีเมลที่ใช้ลงทะเบียนบัญชีของคุณ เราจะส่งลิงก์สำหรับตั้งรหัสผ่านใหม่ไปให้
                    </p>
</div>
<!-- Form -->
<form class="flex flex-col gap-lg" onsubmit="handleForgotPasswordSubmit(event)">
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface font-medium" for="email-input">อีเมล</label>
<!-- Input field: 1px border, 2px primary green on focus -->
<input class="w-full h-12 px-md py-sm rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface font-body-md focus:border-2 focus:border-primary focus:ring-0 transition-all duration-200" id="email-input" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
<!-- Actions -->
<button class="w-full h-12 flex items-center justify-center bg-primary-container text-on-primary rounded-lg font-label-lg text-label-lg font-semibold hover:bg-primary transition-colors duration-200 active:scale-[0.98]" type="submit">
                        ส่งลิงก์ตั้งรหัสผ่านใหม่
                    </button>
</form>
</div>
<!-- State 2: Success Message (Initially Hidden) -->
<div class="hidden flex-col items-center justify-center text-center gap-lg py-sm fade-in" id="forgot-password-success">
<!-- Success Icon -->
<div class="w-20 h-20 rounded-full bg-secondary-container flex items-center justify-center mb-sm">
<span class="material-symbols-outlined text-[40px] text-primary" data-weight="fill" style="font-variation-settings: 'FILL' 1;">
                        mark_email_read
                    </span>
</div>
<!-- Success Text -->
<div class="flex flex-col gap-sm">
<h2 class="font-title-lg text-title-lg text-on-surface font-semibold">ตรวจสอบอีเมลของคุณ</h2>
<p class="font-body-md text-body-md text-on-surface-variant">
                        เราได้ส่งคำแนะนำในการตั้งรหัสผ่านใหม่ไปยังอีเมลที่คุณระบุแล้ว <br class="hidden md:block"/>กรุณาตรวจสอบกล่องจดหมายของคุณ
                    </p>
</div>
<!-- Return Action -->
<button class="mt-sm w-full h-12 flex items-center justify-center border-2 border-primary-container text-primary-container bg-surface-container-lowest rounded-lg font-label-lg text-label-lg font-semibold hover:bg-surface transition-colors duration-200 active:scale-[0.98]" onclick="resetFormState()" type="button">
                    กลับไปหน้าเข้าสู่ระบบ
                </button>
</div>
</div>
</main>
<script>
        // Simple client-side interaction to demonstrate states
        function handleForgotPasswordSubmit(event) {
            event.preventDefault();
            
            const emailInput = document.getElementById('email-input').value;
            if(emailInput) {
                // Simulate API call delay
                const submitBtn = event.target.querySelector('button[type="submit"]');
                const originalText = submitBtn.innerText;
                submitBtn.innerText = 'กำลังส่ง...';
                submitBtn.classList.add('opacity-80', 'cursor-not-allowed');

                setTimeout(() => {
                    document.getElementById('forgot-password-form').classList.add('hidden');
                    document.getElementById('forgot-password-form').classList.remove('flex');
                    
                    document.getElementById('forgot-password-success').classList.remove('hidden');
                    document.getElementById('forgot-password-success').classList.add('flex');
                    
                    // Reset button for next time
                    submitBtn.innerText = originalText;
                    submitBtn.classList.remove('opacity-80', 'cursor-not-allowed');
                }, 800);
            }
        }

        function resetFormState() {
            // In a real app, this might navigate back to login screen instead
            document.getElementById('email-input').value = '';
            
            document.getElementById('forgot-password-success').classList.add('hidden');
            document.getElementById('forgot-password-success').classList.remove('flex');
            
            document.getElementById('forgot-password-form').classList.remove('hidden');
            document.getElementById('forgot-password-form').classList.add('flex');
        }
    </script>
</body></html>
