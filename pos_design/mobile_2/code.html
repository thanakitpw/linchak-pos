<body class="bg-surface text-on-surface antialiased font-body-md h-screen flex flex-col justify-center items-center">
<!-- Mobile Screen Container (Max-Width for Preview on Desktop, Full Width on Mobile) -->
<div class="w-full max-w-md h-full max-h-screen bg-background relative flex flex-col overflow-hidden shadow-2xl md:rounded-[32px] md:h-[850px]">

<button aria-label="Close" class="w-10 h-10 flex items-center justify-center text-on-surface-variant hover:bg-surface-container-high rounded-full transition-colors active:scale-95 duration-150">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="font-title-lg text-title-lg text-on-background font-bold tracking-tight">บันทึกการซื้อ</h1>
<button class="h-10 px-sm flex items-center justify-center text-primary hover:bg-surface-container-high rounded-lg transition-colors active:scale-95 duration-150">
<span class="font-label-lg text-label-lg font-semibold">บันทึก</span>
</button>
</header>

<main class="flex-1 overflow-y-auto px-md py-lg space-y-lg pb-32">

<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface-variant">วันที่ซื้อ</label>
<div class="relative flex items-center">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl px-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors cursor-pointer" readonly="" type="text" value="12 พ.ย. 2023"/>
<span class="material-symbols-outlined absolute right-4 text-outline" data-icon="calendar_month">calendar_month</span>
</div>
</div>
<!-- Source Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface-variant">ร้าน / แหล่งที่ซื้อ</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl px-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" placeholder="เช่น ตลาดไท, ร้านเจ๊ปุ๊, Shopee" type="text"/>
</div>
<hr class="border-surface-variant"/>
<!-- Items Section -->
<section class="space-y-md">
<h2 class="font-title-lg text-title-lg font-semibold text-on-background">รายการที่ซื้อ</h2>
<!-- Item Card 1 -->
<div class="bg-surface-container-lowest border border-surface-variant rounded-xl p-md flex flex-col gap-md shadow-[0px_2px_8px_rgba(0,0,0,0.02)]">
<div class="flex justify-between items-start">
<input class="font-title-lg text-title-lg font-semibold text-on-background bg-transparent border-none p-0 focus:outline-none focus:ring-0 w-2/3" placeholder="ชื่อสินค้า" type="text" value="ผักบุ้ง"/>
<button class="text-error hover:bg-error-container p-2 rounded-full transition-colors active:scale-95 duration-150">
<span class="material-symbols-outlined" data-icon="delete">delete</span>
</button>
</div>
<div class="flex flex-wrap items-end justify-between gap-4">

<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-outline">จำนวน</label>
<div class="flex items-center border border-outline-variant rounded-full h-10 bg-surface">
<button class="w-10 h-full flex items-center justify-center text-on-surface-variant active:bg-surface-variant rounded-l-full transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="remove">remove</span>
</button>
<span class="w-8 text-center font-label-lg text-label-lg font-semibold">5</span>

<span class="material-symbols-outlined text-[20px]" data-icon="add">add</span>
</button>
</div>
</div>

</div>
<!-- Total -->
<div class="flex flex-col gap-xs items-end w-24">
<label class="font-label-sm text-label-sm text-outline">รวม</label>
<span class="font-title-lg text-title-lg font-semibold text-on-background h-10 flex items-center">฿50.00</span>
</div>
</div>
</div>

<input class="font-title-lg text-title-lg font-semibold text-on-background bg-transparent border-none p-0 focus:outline-none focus:ring-0 w-2/3" placeholder="ชื่อสินค้า" type="text" value="น้ำมันพืช"/>

<span class="material-symbols-outlined" data-icon="delete">delete</span>
</button>
</div>
<div class="flex flex-wrap items-end justify-between gap-4">

<div class="flex items-center border border-outline-variant rounded-full h-10 bg-surface">
<button class="w-10 h-full flex items-center justify-center text-on-surface-variant active:bg-surface-variant rounded-l-full transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="remove">remove</span>
</button>
<span class="w-8 text-center font-label-lg text-label-lg font-semibold">2</span>
<button class="w-10 h-full flex items-center justify-center text-primary active:bg-surface-variant rounded-r-full transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="add">add</span>
</button>
</div>
</div>
<!-- Price / Unit -->
<div class="flex flex-col gap-xs flex-1 min-w-[80px]">
<label class="font-label-sm text-label-sm text-outline">ราคา/หน่วย</label>
<input class="w-full bg-surface border border-outline-variant rounded-xl px-3 py-2 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors text-right" type="text" value="฿45.00"/>
</div>
<!-- Total -->
<div class="flex flex-col gap-xs items-end w-24">
<label class="font-label-sm text-label-sm text-outline">รวม</label>
<span class="font-title-lg text-title-lg font-semibold text-on-background h-10 flex items-center">฿90.00</span>

</div>
</div>

<button class="w-full border-2 border-dashed border-outline-variant bg-surface-container-lowest rounded-xl py-3 flex items-center justify-center gap-2 text-primary font-label-lg text-label-lg font-semibold hover:bg-surface-container transition-colors active:scale-[0.98] duration-150">
<span class="material-symbols-outlined text-[20px]" data-icon="add">add</span>
                    เพิ่มรายการ
                </button>
</section>

<div class="bg-primary-container/10 border border-primary-container/20 rounded-xl p-lg flex items-center justify-between mt-sm">
<span class="font-title-lg text-title-lg text-on-surface font-medium">ยอดรวมทั้งหมด</span>
<span class="font-display-lg text-display-lg font-bold text-primary">฿140.00</span>
</div>

<label class="font-label-lg text-label-lg text-on-surface-variant">โน้ต</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl px-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors resize-none" placeholder="เพิ่มรายละเอียดเพิ่มเติม..." rows="3"></textarea>
</div>
