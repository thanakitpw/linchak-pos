<!DOCTYPE html>

<html lang="th"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>เพิ่มสินค้า</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-variant": "#d9e3f4",
                        "on-secondary-container": "#3d6f4d",
                        "primary-fixed-dim": "#60df77",
                        "inverse-primary": "#60df77",
                        "secondary-container": "#b8f0c5",
                        "on-tertiary-fixed-variant": "#3f4944",
                        "surface-container-low": "#eef4ff",
                        "secondary-fixed-dim": "#9dd3aa",
                        "on-tertiary": "#ffffff",
                        "on-secondary-fixed-variant": "#1d5031",
                        "surface-container-highest": "#d9e3f4",
                        "on-secondary": "#ffffff",
                        "on-surface": "#121c28",
                        "inverse-on-surface": "#eaf1ff",
                        "on-error-container": "#93000a",
                        "tertiary-fixed-dim": "#bfc9c2",
                        "primary-fixed": "#7dfc90",
                        "surface-dim": "#d1dbec",
                        "on-primary": "#ffffff",
                        "on-tertiary-fixed": "#151d19",
                        "surface-bright": "#f8f9ff",
                        "outline-variant": "#bdcab9",
                        "primary": "#006e29",
                        "error-container": "#ffdad6",
                        "on-primary-fixed-variant": "#00531d",
                        "surface-tint": "#006e29",
                        "on-primary-fixed": "#002107",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed": "#00210e",
                        "error": "#ba1a1a",
                        "surface-container": "#e5eeff",
                        "outline": "#6e7b6b",
                        "secondary": "#366847",
                        "secondary-fixed": "#b8f0c5",
                        "surface-container-high": "#dfe9fa",
                        "surface": "#f8f9ff",
                        "primary-container": "#2bb14f",
                        "tertiary-fixed": "#dbe5de",
                        "background": "#f8f9ff",
                        "tertiary-container": "#939d97",
                        "on-surface-variant": "#3e4a3d",
                        "tertiary": "#57615b",
                        "on-tertiary-container": "#2b3530",
                        "inverse-surface": "#27313e",
                        "on-primary-container": "#003c13",
                        "on-background": "#121c28",
                        "on-error": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "8px",
                        "xs": "4px",
                        "lg": "24px",
                        "gutter": "12px",
                        "container-margin": "16px",
                        "unit": "4px",
                        "md": "16px",
                        "xl": "32px"
                    },
                    "fontFamily": {
                        "headline-md": ["IBM Plex Sans"],
                        "label-lg": ["IBM Plex Sans"],
                        "body-lg": ["IBM Plex Sans"],
                        "display-lg": ["IBM Plex Sans"],

                        "headline-lg-mobile": ["IBM Plex Sans"],
                        "body-md": ["IBM Plex Sans"],

                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],

                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "600" }]

<style>
        body { background-color: #f8f9ff; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body-md pb-24 h-screen flex flex-col">
<!-- TopAppBar -->
<header class="flex items-center justify-between px-md h-16 w-full bg-surface dark:bg-surface-dim top-0 sticky z-40 flat no shadows">
<button class="text-on-surface-variant hover:bg-surface-container-high transition-colors p-2 rounded-full active:scale-95 duration-150 flex items-center justify-center">
<span class="material-symbols-outlined">close</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile text-primary dark:text-primary-fixed-dim">เพิ่มสินค้า</h1>
<button class="font-label-lg text-label-lg text-primary hover:bg-surface-container-high transition-colors px-4 py-2 rounded-full active:scale-95 duration-150">
            บันทึก
        </button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto px-container-margin py-md space-y-lg flex flex-col items-center max-w-md mx-auto w-full">
<!-- Image Uploader (Bento Style) -->
<div class="w-full aspect-square bg-surface-container-low rounded-xl border border-dashed border-outline-variant flex flex-col items-center justify-center cursor-pointer hover:bg-surface-container transition-colors relative overflow-hidden group">
<div class="flex flex-col items-center space-y-sm text-on-surface-variant group-hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[48px]">add_a_photo</span>
<span class="font-label-lg text-label-lg">เพิ่มรูป</span>
</div>
</div>
<!-- Form Fields -->
<div class="w-full space-y-md">
<!-- Category -->
<div class="flex flex-col space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant">หมวดหมู่</label>
<div class="relative">
<select class="w-full bg-surface border border-outline-variant rounded-lg px-md py-sm appearance-none focus:outline-none focus:border-primary focus:border-2 font-body-md text-on-surface pr-10">
<option disabled="" selected="" value="">เลือกหมวดหมู่</option>
<option value="fruit">ผลไม้</option>
<option value="beverage">เครื่องดื่ม</option>
<option value="snack">ของกินเล่น</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">arrow_drop_down</span>
</div>
</div>
<!-- Product Name -->
<div class="flex flex-col space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant">ชื่อสินค้า</label>
<input class="w-full bg-surface border border-outline-variant rounded-lg px-md py-sm focus:outline-none focus:border-primary focus:border-2 font-body-md text-on-surface placeholder-on-surface-variant/50" placeholder="เช่น ผลไม้แช่บ๊วย" type="text"/>
</div>
<!-- Description -->
<div class="flex flex-col space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant">รายละเอียด</label>
<textarea class="w-full bg-surface border border-outline-variant rounded-lg px-md py-sm focus:outline-none focus:border-primary focus:border-2 font-body-md text-on-surface resize-none placeholder-on-surface-variant/50" placeholder="เพิ่มรายละเอียดสินค้า (ถ้ามี)" rows="3"></textarea>
</div>
<!-- Price -->
<div class="flex flex-col space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant">ราคา</label>
<div class="relative">
<span class="absolute left-md top-1/2 -translate-y-1/2 font-body-md text-on-surface-variant">฿</span>
<input class="w-full bg-surface border border-outline-variant rounded-lg pl-10 pr-md py-sm focus:outline-none focus:border-primary focus:border-2 font-body-md text-on-surface tabular-nums" placeholder="0.00" type="number"/>
</div>
</div>
</div>
<!-- Big Green Button -->
<div class="w-full pt-md mt-auto pb-4">
<button class="w-full bg-primary-container text-on-primary rounded-full py-4 font-title-lg text-title-lg flex items-center justify-center space-x-sm hover:bg-primary transition-colors active:scale-95 duration-150 shadow-[0px_4px_12px_rgba(0,0,0,0.05)]">
<span>บันทึกสินค้า</span>
</button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-gutter py-sm shadow-sm bg-surface dark:bg-surface-container rounded-t-xl shadow-[0px_-4px_12px_rgba(0,0,0,0.05)]">
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1 hover:bg-surface-variant dark:hover:bg-surface-container-highest transition-colors active:scale-90 duration-200">
<span class="material-symbols-outlined mb-1">point_of_sale</span>
<span class="font-label-sm text-label-sm">ขาย</span>
</button>
<!-- Active state for "Products" since we are adding a product -->
<button class="flex flex-col items-center justify-center bg-secondary-container dark:bg-on-secondary-container text-on-secondary-container dark:text-secondary-container rounded-full px-4 py-1 hover:bg-surface-variant dark:hover:bg-surface-container-highest transition-colors active:scale-90 duration-200">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">inventory_2</span>
<span class="font-label-sm text-label-sm">สินค้า</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1 hover:bg-surface-variant dark:hover:bg-surface-container-highest transition-colors active:scale-90 duration-200">
<span class="material-symbols-outlined mb-1">payments</span>
<span class="font-label-sm text-label-sm">ต้นทุน</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1 hover:bg-surface-variant dark:hover:bg-surface-container-highest transition-colors active:scale-90 duration-200">
<span class="material-symbols-outlined mb-1">leaderboard</span>
<span class="font-label-sm text-label-sm">สรุป</span>
</button>
</nav>
</body></html>
