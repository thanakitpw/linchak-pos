<style>
        body { font-family: 'IBM Plex Sans', sans-serif; }
    </style>

<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center p-md antialiased">
<!-- Login Card Container -->
<main class="w-full max-w-[420px] bg-surface-container-lowest rounded-xl shadow-[0px_12px_32px_rgba(0,0,0,0.1)] p-xl border border-surface-variant flex flex-col gap-lg">
<!-- Header / Logo -->
<header class="flex flex-col items-center text-center gap-sm">
<div class="w-16 h-16 bg-primary-container rounded-full flex items-center justify-center mb-sm shadow-[0px_4px_12px_rgba(0,0,0,0.05)]">
<span class="material-symbols-outlined text-[32px] text-on-primary-container" data-icon="storefront" style="font-variation-settings: 'FILL' 1;">storefront</span>
</div>
<h1 class="font-headline-md text-headline-md text-primary">PromptPay POS</h1>
<p class="font-body-md text-body-md text-on-surface-variant">เข้าสู่ระบบเพื่อจัดการร้านค้าของคุณ</p>
</header>
<!-- Login Form -->
<form action="#" class="flex flex-col gap-md" method="POST">
<!-- Email Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface" for="email">อีเมล</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline" data-icon="mail">mail</span>
<input class="w-full pl-xl pr-sm py-sm bg-surface-container-lowest border border-outline-variant rounded-lg focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-body-md text-on-surface placeholder:text-outline transition-colors outline-none" id="email" name="email" placeholder="your@email.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-label-lg text-label-lg text-on-surface" for="password">รหัสผ่าน</label>
<a class="font-label-sm text-label-sm text-primary hover:text-on-primary-fixed-variant transition-colors" href="#">ลืมรหัสผ่าน?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline" data-icon="lock">lock</span>
<input class="w-full pl-xl pr-sm py-sm bg-surface-container-lowest border border-outline-variant rounded-lg focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-body-md text-on-surface placeholder:text-outline transition-colors outline-none" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-sm top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
<!-- Primary Login Button -->
<button class="w-full h-12 mt-sm bg-primary-container text-on-primary font-label-lg text-label-lg rounded-full flex items-center justify-center gap-sm hover:bg-primary transition-colors duration-200 active:scale-[0.98] shadow-[0px_4px_12px_rgba(0,0,0,0.05)]" type="submit">
                เข้าสู่ระบบ
            </button>
</form>
<!-- Divider -->
<div class="flex items-center gap-md">
<hr class="flex-1 border-t border-outline-variant/50"/>
<span class="font-label-sm text-label-sm text-outline">หรือ</span>
<hr class="flex-1 border-t border-outline-variant/50"/>
</div>
<!-- Google Login Button -->
<button class="w-full h-12 bg-surface-container-lowest border border-outline-variant text-on-surface font-label-lg text-label-lg rounded-full flex items-center justify-center gap-sm hover:bg-surface-variant/50 transition-colors duration-200 active:scale-[0.98]" type="button">
<svg class="w-5 h-5" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25C22.56 11.47 22.49 10.72 22.36 10H12V14.26H17.92C17.67 15.63 16.89 16.79 15.72 17.57V20.34H19.29C21.37 18.42 22.56 15.6 22.56 12.25Z" fill="#4285F4"></path>
<path d="M12 23C14.97 23 17.46 22.02 19.29 20.34L15.72 17.57C14.73 18.23 13.48 18.64 12 18.64C9.13 18.64 6.7 16.7 5.82 14.12H2.14V16.97C3.96 20.59 7.69 23 12 23Z" fill="#34A853"></path>
<path d="M5.82 14.12C5.59 13.46 5.46 12.74 5.46 12C5.46 11.26 5.59 10.54 5.82 9.88V7.03H2.14C1.39 8.52 1 10.21 1 12C1 13.79 1.39 15.48 2.14 16.97L5.82 14.12Z" fill="#FBBC05"></path>
<path d="M12 5.36C13.62 5.36 15.07 5.92 16.21 7.02L19.38 3.86C17.45 2.06 14.97 1 12 1C7.69 1 3.96 3.41 2.14 7.03L5.82 9.88C6.7 7.3 9.13 5.36 12 5.36Z" fill="#EA4335"></path>
</svg>
            เข้าสู่ระบบด้วย Google
        </button>
<!-- Sign Up Link -->
<div class="text-center mt-xs">
<p class="font-body-md text-body-md text-on-surface-variant">
                ยังไม่มีบัญชี? 
                <a class="font-label-lg text-label-lg text-primary hover:text-on-primary-fixed-variant transition-colors font-semibold ml-xs" href="#">สมัครสมาชิกฟรี</a>
</p>
</div>
</main>
</body></html>
