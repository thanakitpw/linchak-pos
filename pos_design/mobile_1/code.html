<style>
        body { font-family: 'IBM Plex Sans', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-surface text-on-surface h-screen flex flex-col items-center justify-center">
<div class="w-full max-w-[390px] h-full sm:h-[844px] bg-surface relative flex flex-col shadow-[0px_12px_32px_rgba(0,0,0,0.1)] sm:rounded-[40px] overflow-hidden">
<!-- Top App Bar (Based on Shared Components JSON) -->
<header class="bg-surface w-full top-0 flex items-center justify-between px-md py-sm z-10">
<button class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-surface-variant/20 transition-colors duration-200 active:scale-95 text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md-mobile text-headline-md-mobile text-primary font-bold">เข้าสู่ระบบ</h1>
<div class="w-12 h-12"></div>
</header>
<!-- Main Content -->
<main class="flex-1 px-md py-lg flex flex-col overflow-y-auto">
<!-- Logo Section -->
<div class="flex flex-col items-center justify-center mt-xl mb-xl">
<div class="w-[72px] h-[72px] bg-primary-container rounded-2xl flex items-center justify-center shadow-[0px_4px_12px_rgba(0,0,0,0.05)] mb-md">
<span class="material-symbols-outlined text-on-primary text-[40px]" data-icon="point_of_sale" data-weight="fill" style="font-variation-settings: 'FILL' 1;">point_of_sale</span>
</div>
</div>
<!-- Form -->
<form class="flex flex-col gap-md">
<!-- Email Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface" for="email">อีเมล</label>
<div class="relative">
<input class="w-full h-[48px] px-md rounded bg-surface-container-lowest border border-outline-variant text-on-surface font-body-md focus:outline-none focus:border-2 focus:border-primary-container focus:ring-0 transition-all placeholder:text-outline" id="email" placeholder="example@email.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface" for="password">รหัสผ่าน</label>
<div class="relative">
<input class="w-full h-[48px] px-md pr-12 rounded bg-surface-container-lowest border border-outline-variant text-on-surface font-body-md focus:outline-none focus:border-2 focus:border-primary-container focus:ring-0 transition-all placeholder:text-outline" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-0 top-0 h-full w-12 flex items-center justify-center text-outline hover:text-on-surface transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" data-icon="visibility" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end mt-xs">
<a class="font-label-lg text-label-lg text-primary-container hover:text-primary transition-colors" href="#">ลืมรหัสผ่าน?</a>
</div>
<!-- Login Button -->
<button class="w-full h-[48px] mt-md bg-primary-container text-on-primary rounded font-label-lg text-label-lg flex items-center justify-center hover:opacity-90 active:scale-95 transition-all shadow-[0px_4px_12px_rgba(0,0,0,0.05)]" type="submit">
                    เข้าสู่ระบบ
                </button>
</form>
<!-- Divider -->
<div class="flex items-center gap-md my-xl">
<div class="flex-1 h-[1px] bg-outline-variant/50"></div>
<span class="font-label-sm text-label-sm text-outline">หรือ</span>
<div class="flex-1 h-[1px] bg-outline-variant/50"></div>
</div>
<!-- Social Login -->
<button class="w-full h-[48px] bg-surface-container-lowest border border-primary-container text-primary-container rounded font-label-lg text-label-lg flex items-center justify-center gap-sm hover:bg-surface-container-low active:scale-95 transition-all" type="button">
<svg class="w-5 h-5" fill="none" height="24" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25C22.56 11.47 22.49 10.72 22.36 10H12V14.26H17.92C17.66 15.63 16.88 16.8 15.71 17.58V20.34H19.28C21.36 18.42 22.56 15.6 22.56 12.25Z" fill="#4285F4"></path>
<path d="M12 23C14.97 23 17.46 22.02 19.28 20.34L15.71 17.58C14.73 18.24 13.48 18.64 12 18.64C9.13 18.64 6.7 16.7 5.84 14.1H2.15V16.96C3.96 20.56 7.69 23 12 23Z" fill="#34A853"></path>
<path d="M5.84 14.1C5.62 13.44 5.5 12.74 5.5 12C5.5 11.26 5.62 10.56 5.84 9.9V7.04H2.15C1.41 8.52 1 10.2 1 12C1 13.8 1.41 15.48 2.15 16.96L5.84 14.1Z" fill="#FBBC05"></path>
<path d="M12 5.36C13.62 5.36 15.07 5.92 16.21 7.01L19.36 3.86C17.45 2.08 14.97 1 12 1C7.69 1 3.96 3.44 2.15 7.04L5.84 9.9C6.7 7.3 9.13 5.36 12 5.36Z" fill="#EA4335"></path>
</svg>
                เข้าสู่ระบบด้วย Google
            </button>
<!-- Bottom Link -->
<div class="mt-auto pt-xl pb-md text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    ยังไม่มีบัญชี? 
                    <a class="text-primary-container font-bold hover:text-primary transition-colors" href="#">สมัครฟรี 7 วัน</a>
</p>
</div>
</main>
</div>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.textContent = 'visibility_off';
                eyeIcon.setAttribute('data-icon', 'visibility_off');
            } else {
                passwordInput.type = 'password';
                eyeIcon.textContent = 'visibility';
                eyeIcon.setAttribute('data-icon', 'visibility');
            }
        }
    </script>
</body></html>
