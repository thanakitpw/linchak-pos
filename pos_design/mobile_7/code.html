<!DOCTYPE html>

<html lang="th"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>POS Merchant - กำไรรายเดือน</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {

            theme: {
                extend: {
                    "colors": {
                        "surface-variant": "#d9e3f4",
                        "on-secondary-container": "#3d6f4d",
                        "on-secondary-fixed-variant": "#1d5031",
                        "secondary": "#366847",
                        "inverse-primary": "#60df77",
                        "secondary-fixed": "#b8f0c5",
                        "primary-container": "#2bb14f",
                        "on-tertiary": "#ffffff",
                        "on-background": "#121c28",
                        "on-primary": "#ffffff",
                        "surface-container-low": "#eef4ff",
                        "inverse-on-surface": "#eaf1ff",
                        "on-surface-variant": "#3e4a3d",
                        "on-secondary-fixed": "#00210e",
                        "tertiary-container": "#939d97",
                        "secondary-fixed-dim": "#9dd3aa",
                        "on-surface": "#121c28",
                        "on-primary-container": "#003c13",
                        "surface-container-high": "#dfe9fa",
                        "primary-fixed": "#7dfc90",
                        "surface-container-highest": "#d9e3f4",
                        "surface-tint": "#006e29",
                        "on-tertiary-fixed": "#151d19",
                        "on-error": "#ffffff",
                        "primary-fixed-dim": "#60df77",
                        "tertiary": "#57615b",
                        "on-secondary": "#ffffff",
                        "inverse-surface": "#27313e",
                        "surface-dim": "#d1dbec",
                        "tertiary-fixed-dim": "#bfc9c2",
                        "on-primary-fixed": "#002107",
                        "primary": "#006e29",
                        "outline": "#6e7b6b",
                        "surface-container-lowest": "#ffffff",
                        "surface-bright": "#f8f9ff",
                        "on-tertiary-fixed-variant": "#3f4944",
                        "on-tertiary-container": "#2b3530",
                        "surface-container": "#e5eeff",
                        "outline-variant": "#bdcab9",
                        "error-container": "#ffdad6",
                        "tertiary-fixed": "#dbe5de",
                        "surface": "#f8f9ff",
                        "error": "#ba1a1a",
                        "secondary-container": "#b8f0c5",
                        "on-error-container": "#93000a",
                        "background": "#f8f9ff",
                        "on-primary-fixed-variant": "#00531d"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-margin": "16px",
                        "xl": "32px",
                        "gutter": "12px",
                        "lg": "24px",
                        "xs": "4px",
                        "unit": "4px",
                        "sm": "8px",
                        "md": "16px"
                    },
                    "fontFamily": {
                        "body-lg": ["IBM Plex Sans"],
                        "title-lg": ["IBM Plex Sans"],
                        "headline-md": ["IBM Plex Sans"],
                        "body-md": ["IBM Plex Sans"],
                        "label-sm": ["IBM Plex Sans"],
                        "headline-lg-mobile": ["IBM Plex Sans"],
                        "label-lg": ["IBM Plex Sans"],
                        "display-lg": ["IBM Plex Sans"],
                        "headline-lg": ["IBM Plex Sans"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "title-lg": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500" }],
                        "display-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'IBM Plex Sans', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen pb-[80px]">
<!-- TopAppBar (Customized for intent, but using structure) -->
<header class="w-full sticky top-0 z-40 bg-surface dark:bg-surface-dim flex items-center justify-between px-container-margin py-md">
<button class="flex items-center justify-center p-2 rounded-full hover:bg-surface-container-low transition-colors active:scale-95 duration-150 text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-title-lg text-title-lg flex-1 text-center text-on-surface">กำไรรายเดือน</h1>
<button class="flex items-center gap-1 p-2 rounded-lg bg-surface-container-low hover:bg-surface-container-high transition-colors text-primary active:scale-95 duration-150">
<span class="font-label-lg text-label-lg">ส.ค. 2026</span>
<span class="material-symbols-outlined text-[20px]" data-icon="arrow_drop_down">arrow_drop_down</span>
</button>
</header>
<main class="px-container-margin pt-4 pb-lg flex flex-col gap-lg">
<!-- Hero Block -->
<section class="bg-surface-container-lowest rounded-xl p-lg shadow-[0px_4px_12px_rgba(0,0,0,0.05)] border border-surface-variant/50">
<h2 class="font-body-md text-body-md text-on-surface-variant mb-2">กำไรเดือนนี้</h2>
<div class="flex items-baseline gap-2 mb-4">
<span class="font-headline-lg-mobile text-headline-lg-mobile text-primary-container">฿</span>
<span class="font-display-lg text-display-lg text-primary-container tabular-nums">12,050.00</span>
</div>
<div class="inline-flex items-center gap-1 bg-tertiary-fixed text-primary px-3 py-1 rounded-full">
<span class="text-sm">▲</span>
<span class="font-label-sm text-label-sm">18% จากเดือนก่อน</span>
</div>
</section>
<!-- P&L Breakdown -->
<section class="bg-surface-container-lowest rounded-xl p-md shadow-[0px_4px_12px_rgba(0,0,0,0.05)] border border-surface-variant/50">
<div class="flex justify-between items-center py-2">
<span class="font-body-md text-body-md text-on-surface">ยอดขายรวม</span>
<span class="font-body-md text-body-md text-on-surface tabular-nums">฿42,300.00</span>
</div>
<div class="flex justify-between items-center py-2">
<span class="font-body-md text-body-md text-on-surface-variant">ต้นทุนรวม (-)</span>
<span class="font-body-md text-body-md text-on-surface-variant tabular-nums">฿30,250.00</span>
</div>
<hr class="border-surface-variant my-3"/>
<div class="flex justify-between items-center py-2">
<span class="font-title-lg text-title-lg text-on-surface">กำไร</span>
<span class="font-title-lg text-title-lg text-primary-container tabular-nums">฿12,050.00</span>
</div>
<div class="mt-4 pt-4 border-t border-surface-variant/50 flex justify-center items-center gap-2 text-on-surface-variant">
<span class="font-label-sm text-label-sm">จำนวนบิล 168</span>
<span class="text-surface-variant mx-1">•</span>
<span class="font-label-sm text-label-sm">จำนวนครั้งที่ซื้อ 12</span>
</div>
</section>
<!-- Chart Section -->
<section class="bg-surface-container-lowest rounded-xl p-md shadow-[0px_4px_12px_rgba(0,0,0,0.05)] border border-surface-variant/50">
<h3 class="font-title-lg text-title-lg text-on-surface mb-4">แนวโน้มกำไร 6 เดือน</h3>
<!-- Simplified Bar Chart Representation -->
<div class="flex items-end justify-between h-40 pt-4 pb-2 border-b border-surface-variant">
<!-- Bar 1 -->
<div class="flex flex-col items-center gap-2 w-1/6">
<div class="w-full max-w-[32px] bg-surface-container-high rounded-t-sm h-[40%] transition-all"></div>
</div>
<!-- Bar 2 -->
<div class="flex flex-col items-center gap-2 w-1/6">
<div class="w-full max-w-[32px] bg-surface-container-high rounded-t-sm h-[50%] transition-all"></div>
</div>
<!-- Bar 3 -->
<div class="flex flex-col items-center gap-2 w-1/6">
<div class="w-full max-w-[32px] bg-surface-container-high rounded-t-sm h-[30%] transition-all"></div>
</div>
<!-- Bar 4 -->
<div class="flex flex-col items-center gap-2 w-1/6">
<div class="w-full max-w-[32px] bg-surface-container-high rounded-t-sm h-[60%] transition-all"></div>
</div>
<!-- Bar 5 -->
<div class="flex flex-col items-center gap-2 w-1/6">
<div class="w-full max-w-[32px] bg-surface-container-high rounded-t-sm h-[45%] transition-all"></div>
</div>
<!-- Bar 6 (Current) -->
<div class="flex flex-col items-center gap-2 w-1/6">
<div class="w-full max-w-[32px] bg-primary-container rounded-t-sm h-[80%] shadow-[0px_2px_8px_rgba(43,177,79,0.4)] transition-all"></div>
</div>
</div>
<!-- X Axis Labels -->
<div class="flex items-center justify-between pt-2">
<span class="font-label-sm text-label-sm text-on-surface-variant w-1/6 text-center">มี.ค.</span>
<span class="font-label-sm text-label-sm text-on-surface-variant w-1/6 text-center">เม.ย.</span>
<span class="font-label-sm text-label-sm text-on-surface-variant w-1/6 text-center">พ.ค.</span>
<span class="font-label-sm text-label-sm text-on-surface-variant w-1/6 text-center">มิ.ย.</span>
<span class="font-label-sm text-label-sm text-on-surface-variant w-1/6 text-center">ก.ค.</span>
<span class="font-label-sm text-label-sm text-primary font-bold w-1/6 text-center">ส.ค.</span>
</div>
</section>
<!-- Muted Note -->
<p class="font-label-sm text-label-sm text-outline text-center px-4">กำไร = ยอดขายรวม − ต้นทุนรวม ของเดือนนี้</p>
</main>
<!-- BottomNavBar (From JSON) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-2 bg-surface-container-lowest dark:bg-inverse-surface shadow-[0px_-4px_12px_rgba(0,0,0,0.05)] rounded-t-xl md:hidden">
<!-- Tab 1 (Active) -->
<button class="flex flex-col items-center justify-center min-w-[64px] active:scale-90 duration-200">
<div class="flex flex-col items-center justify-center bg-secondary-container dark:bg-on-secondary-fixed-variant text-on-secondary-container dark:text-secondary-fixed rounded-full px-4 py-1 mb-1">
<span class="material-symbols-outlined" data-icon="assessment" data-weight="fill" style="font-variation-settings: 'FILL' 1;">assessment</span>
</div>
<span class="font-label-sm text-label-sm text-on-secondary-container dark:text-secondary-fixed font-bold">สรุป</span>
</button>
<!-- Tab 2 (Inactive) -->
<button class="flex flex-col items-center justify-center min-w-[64px] hover:bg-surface-container-high transition-all rounded-xl p-1 active:scale-90 duration-200 group text-on-surface-variant dark:text-surface-variant">
<div class="flex flex-col items-center justify-center mb-1 group-hover:text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="trending_up">trending_up</span>
</div>
<span class="font-label-sm text-label-sm group-hover:text-primary transition-colors">กำไร</span>
</button>
<!-- Tab 3 (Inactive) -->
<button class="flex flex-col items-center justify-center min-w-[64px] hover:bg-surface-container-high transition-all rounded-xl p-1 active:scale-90 duration-200 group text-on-surface-variant dark:text-surface-variant">
<div class="flex flex-col items-center justify-center mb-1 group-hover:text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="receipt_long">receipt_long</span>
</div>
<span class="font-label-sm text-label-sm group-hover:text-primary transition-colors">รายการ</span>
</button>
</nav>
</body></html>
